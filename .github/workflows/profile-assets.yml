name: Update profile assets

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  update:
    name: Generate commit heatmap and language chart
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: tolimsuite
        run: python3 scripts/generate_profile_assets.py

      - name: Commit updated assets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- profile/assets)" ]; then
            echo "Profile assets are up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/assets
          git commit -m 'chore: update profile assets'
          git push
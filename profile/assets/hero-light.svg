<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="TOLIM Technologies">
<defs>
<linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#eef6ff"/><stop offset="100%" stop-color="#f7f2ff"/></linearGradient>
<linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0969da"/><stop offset="55%" stop-color="#8250df"/><stop offset="100%" stop-color="#0969da"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1f2328" opacity="0.10"/></pattern>
<clipPath id="hero-clip"><rect width="1000" height="260" rx="24"/></clipPath>
<clipPath id="avatar-clip"><circle cx="140" cy="130" r="66"/></clipPath>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}</style>
<rect width="1000" height="260" rx="24" fill="url(#hero-bg)" stroke="#d0d7de"/>
<g clip-path="url(#hero-clip)">
<rect width="1000" height="260" fill="url(#dots)"/>
<circle cx="900" cy="20" r="150" fill="#38bdf8" opacity="0.18" filter="url(#blur)"/>
<circle cx="760" cy="260" r="170" fill="#a78bfa" opacity="0.15" filter="url(#blur)"/>
<text x="980" y="250" text-anchor="end" font-size="220" font-weight="800" fill="#1f2328" opacity="0.04">T</text>
</g>
<circle cx="140" cy="130" r="74" fill="none" stroke="url(#accent)" stroke-width="3"/>
<image x="74" y="64" width="132" height="132" href="data:image/png;base64," clip-path="url(#avatar-clip)" preserveAspectRatio="xMidYMid slice"/>
<text x="240" y="110" font-size="42" font-weight="700" fill="url(#accent)" letter-spacing="-1">TOLIM Technologies</text>
<text x="240" y="149" font-size="17" fill="#1f2328">Secure by design. Delivered with care.</text>
<text x="240" y="177" font-size="15" fill="#656d76">安全设计，可靠交付。</text>
<rect x="240" y="199" width="210" height="28" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="345" y="218" text-anchor="middle" font-size="10" letter-spacing="1.6" fill="#656d76">SECURE BY DESIGN</text>
</svg>